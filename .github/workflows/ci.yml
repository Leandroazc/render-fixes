name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Lints are shown, not fatal: the trees this one comes from carry dozens
      # of older ones (unused items, is_multiple_of, sort_unstable). A build
      # that does not compile still fails here.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked
